name: Build Windows

# scripts/build_windows.py builds the plugin zip and
# plugin-dependencies.tar.gz (Python 3.14 runtime + cp314 packages). Decky Loader downloads the archive with the
# plugin (package.json remote_binary). A run with release_version publishes both as a draft GitHub release; the zip's
# remote_binary URL points at that release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release, also its tag (e.g. 1.0.0, no "v"). Leave empty for a build without release.'
        required: false
        type: string

# Actions are pinned to commit SHAs (the comment names the release; Dependabot updates both)
permissions:
  contents: read

# A newer push to the same branch or PR cancels the build in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Get version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="$RELEASE_VERSION"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tests
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm run typecheck
          corepack pnpm test
          python -m compileall -q main.py py_modules scripts

      - name: Build plugin and dependencies
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          corepack enable
          python scripts/build_windows.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --out out

      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: decky-translator-windows
          path: out/decky-translator-windows.zip

      - name: Upload dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plugin-dependencies
          path: out/plugin-dependencies.tar.gz

  release:
    if: inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: decky-translator-windows

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plugin-dependencies

      - name: Publish draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            decky-translator-windows.zip
            plugin-dependencies.tar.gz
          draft: true
          prerelease: false
          generate_release_notes: true
