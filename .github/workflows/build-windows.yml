name: Build Windows

# Tests, then scripts/build_windows.py builds the plugin zip and plugin-dependencies.tar.gz.
# A run with release_version publishes both as a draft GitHub release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release, also its tag (e.g. 1.0.0, no "v"). Leave empty for a build without release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true

      - name: Get version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="$RELEASE_VERSION"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Everything below runs without Steam, Decky or a game, and with the network stubbed
      - name: Install test dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          uv sync --locked

      - name: Frontend tests
        shell: bash
        run: |
          corepack pnpm run typecheck
          corepack pnpm test

      - name: Backend tests
        shell: bash
        run: |
          uv run --locked pytest
          uv run --locked python -m compileall -q main.py py_modules scripts

      - name: Build plugin and dependencies
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --locked python scripts/build_windows.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --out out

      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: decky-translator-windows
          path: out/decky-translator-windows.zip

      - name: Upload dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plugin-dependencies
          path: out/plugin-dependencies.tar.gz

  release:
    if: inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: decky-translator-windows

      - name: Download dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plugin-dependencies

      - name: Publish draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            decky-translator-windows.zip
            plugin-dependencies.tar.gz
          draft: true
          prerelease: false
          generate_release_notes: true
